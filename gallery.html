<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Our Memories ❤️</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="heartContainer"></div>

  
  <div class="card">
    <div class="top-ui">
      <div class="marquee">
        <span id="songTitle">Now Playing: ❤️</span>
      </div>

  <div class="music-controls">
  <button id="playPauseBtn">⏸️</button>
  <button id="nextBtn">⏭️</button>
</div>

<audio id="bgMusic"></audio>

      <div class="volume-control">
        🔊
        <input
          type="range"
          min="0"
          max="1"
          step="0.01"
          id="volumeSlider"
        />
        </div>

    <h1>Our Memories 📸</h1>
    <p class="letter">
      Every picture here is a reminder of how lucky I am
      to have you in my life.
    </p>

    <div class="gallery">
      <img src="images/pic1.jpg" alt="Memory 1">
      <img src="images/pic2.jpg" alt="Memory 2">
      <img src="images/pic3.jpg" alt="Memory 3">
      <img src="images/pic4.jpg" alt="Memory 4">
        <img src="images/pic5.jpg" alt="Memory 5">
        <img src="images/pic6.jfif" alt="Memory 6">
        <img src="images/pic7.png" alt="Memory 7">
        <img src="images/pic8.png" alt="Memory 8">
        <img src="images/pic9.jfif" alt="Memory 9">
        <img src="images/pic10.png" alt="Memory 10">
        <img src="images/pic11.png" alt="Memory 11">
        <img src="images/pic12.jpg" alt="Memory 12">
        <img src="images/pic13.jpg" alt="Memory 13">
        <img src="images/pic15.jpg" alt="Memory 15">
        <img src="images/pic16.jpg" alt="Memory 16">
    </div>

    <a href="index.html" class="back-btn">← Back to Letter</a>
  </div>

  <div id="lightbox">
  <img id="lightboxImg">
  </div>

<script src="script.js"></script>
</body>
</html>
